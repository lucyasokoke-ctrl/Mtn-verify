<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Management Gateway</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
        .form-container { width: 100%; max-width: 450px; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .step { display: none; }
        .step.active { display: block; }
        h2 { margin-top: 0; color: #1e293b; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-next { background-color: #0056b3; color: white; }
        .btn-back { background-color: #cbd5e1; color: #334155; }
        .summary-box { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-container">
    <!-- STEP 1 -->
    <div class="step active" id="step1">
        <h2>Loan Application (Step 1 of 3)</h2>
        <div class="form-group">
            <label>Loan Type</label>
            <select id="loanType"><option value="Business Loan">Business Loan</option></select>
        </div>
        <div class="form-group">
            <label>Loan Amount (UGX)</label>
            <input type="number" id="amount" value="1000000">
        </div>
        <div class="form-group">
            <label>Loan Term</label>
            <select id="term"><option value="48 Months">48 Months</option></select>
        </div>
        <div class="form-group">
            <label>Purpose of Loan</label>
            <textarea id="purpose" rows="2" placeholder="Describe context..."></textarea>
        </div>
        <div class="btn-group"><button class="btn-next" onclick="navigate(2)">Next Step</button></div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
        <h2>Personal Information (Step 2 of 3)</h2>
        <div class="form-group"><label>First Name</label><input type="text" id="firstName"></div>
        <div class="form-group"><label>Last Name</label><input type="text" id="lastName"></div>
        <div class="form-group"><label>Phone Number (Uganda)</label><input type="text" id="phone" value="+256"></div>
        <div class="btn-group">
            <button class="btn-back" onclick="navigate(1)">Back</button>
            <button class="btn-next" onclick="navigate(3)">Next Step</button>
        </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="step3">
        <h2>Income Verification (Step 3 of 3)</h2>
        <div class="form-group">
            <label>Employment Status</label>
            <select id="employmentStatus"><option value="Self-employed">Self-employed</option></select>
        </div>
        <div class="form-group"><label>Annual Income (UGX)</label><input type="number" id="income"></div>
        
        <h3>Application Summary</h3>
        <div class="summary-box">
            <p><strong>Amount:</strong> UGX <span id="sumAmount">0</span></p>
            <p><strong>Term:</strong> <span id="sumTerm">-</span></p>
        </div>
        
        <div class="btn-group">
            <button class="btn-back" onclick="navigate(2)">Back</button>
            <button class="btn-next" style="background-color:#22c55e;" onclick="submitForm()">Submit Application</button>
        </div>
    </div>
</div>

<script>
    function navigate(stepNum) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step${stepNum}`).classList.add('active');
        
        if(stepNum === 3) {
            document.getElementById('sumAmount').innerText = parseInt(document.getElementById('amount').value).toLocaleString();
            document.getElementById('sumTerm').innerText = document.getElementById('term').value;
        }
    }

    async function submitForm() {
        const payload = {
            loanType: document.getElementById('loanType').value,
            amount: document.getElementById('amount').value,
            term: document.getElementById('term').value,
            purpose: document.getElementById('purpose').value,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            phone: document.getElementById('phone').value,
            employmentStatus: document.getElementById('employmentStatus').value,
            income: document.getElementById('income').value,
        };

        const response = await fetch('/api/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        alert(result.message);
    }
</script>
</body>
</html>
