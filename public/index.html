<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Header Bar */
        .nav-header {
            background-color: #003366;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
        }

        .nav-header .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Main Content Grid Wrapper */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Central Card Interface Component */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 30px 24px;
            text-align: center;
        }

        .page-title {
            font-size: 24px;
            color: #0b2240;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        /* Step Progress Tracking Elements */
        .progress-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            gap: 8px;
        }

        .progress-bar {
            height: 4px;
            flex: 1;
            background-color: #e0e0e0;
            border-radius: 2px;
        }

        .progress-bar.active {
            background-color: #ffcc00;
        }

        /* Form Styling Core Rules */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
            color: #333;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }

        /* Slider Controls Layout Logic */
        .slider-container {
            margin: 20px 0;
        }

        .slider {
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        /* Value Spotlighting Rules */
        .highlight-val {
            font-size: 22px;
            font-weight: bold;
            color: #ffbb00;
            margin-top: 4px;
        }

        .display-box {
            background-color: #fffdf3;
            border: 1px solid #fff3cd;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            text-align: left;
        }

        /* Error Notification Banner */
        .error-banner {
            background-color: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Summary Preview Panel */
        .summary-box {
            border: 1px solid #eee;
            border-left: 4px solid #ffcc00;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            background-color: #fafafa;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid #f7f7f7;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row span:first-child {
            color: #777;
        }

        .summary-row span:last-child {
            font-weight: 600;
        }

        /* Interactive Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background-color: #0b2240;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #051429;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        /* Dark Blue Processing Screen Overlay View */
        .processing-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer Copyright Elements */
        footer {
            background-color: #0b2240;
            color: #a0aec0;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }

        /* Step Routing Engine Style Triggers */
        .hidden { display: none !important; }
        .bg-processing { background-color: #0b2240 !important; }
    </style>
</head>
<body>

    <!-- Header Navigation Layout -->
    <div id="headerNav" class="nav-header">
        <span class="back-btn" onclick="goToStep('calc')">← Back</span>
        <div>Portal</div>
        <div>☰</div>
    </div>

    <!-- Main Dynamic Application Container -->
    <div id="mainContainer" class="container">
        
        <!-- VIEW 1: Main Calculator Layout Screen -->
        <div id="view-calc" class="card">
            <h1 class="page-title">Welcome</h1>
            <p class="page-subtitle">Get solutions easily through our portal</p>
            
            <div class="form-group">
                <label>Amount</label>
                <div class="highlight-val" id="calc-amt-val">ZMW 1,000,500</div>
                <div class="slider-container">
                    <input type="range" min="500" max="5000000" value="1000500" step="500" class="slider" id="amt-slider" oninput="updateCalc()">
                    <div class="slider-labels">
                        <span>ZMW 500</span>
                        <span>ZMW 5,000,000</span>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Term</label>
                <div class="highlight-val">48 Months</div>
            </div>
            
            <div class="display-box">
                <div>
                    <div style="font-size: 14px; color: #666;">Estimated Monthly Payment</div>
                </div>
                <div class="highlight-val" style="font-size: 24px;">ZMW 20,844</div>
            </div>
            
            <button class="btn btn-primary" onclick="goToStep(1)">START APPLICATION</button>
        </div>

        <!-- VIEW 2: Application Entry Step 1 -->
        <div id="view-step1" class="card hidden">
            <h1 class="page-title">Application Details</h1>
            <p class="page-subtitle">Step 1 of 3</p>
            
            <div class="progress-container">
                <div class="progress-bar active"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
            </div>
            
            <div id="error-banner" class="error-banner hidden">
                <span>✕</span> Please complete all required fields.
            </div>
            
            <div class="form-group">
                <label>Type</label>
                <select id="loan-type">
                    <option value="Business Loan">Business Loan</option>
                    <option value="Personal Loan">Personal Loan</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Amount (ZMW)</label>
                <input type="number" id="form-amt" value="1000000">
            </div>
            
            <div class="form-group">
                <label>Term</label>
